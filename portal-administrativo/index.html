<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Administrativo</title><meta name="robots" content="noindex,nofollow"><style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f6f4f8}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;color:#4d176e;font-weight:800;padding:24px}#loading span{display:block;margin-top:8px;color:#766b7e;font-size:13px;font-weight:600}</style></head>
<body><div id="loading">Carregando o Portal Administrativo...<span>Instituto Educacional Canoa Grande</span></div>
<script>(async()=>{try{const r=await fetch('/portal',{cache:'no-store',redirect:'follow'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='Não foi possível carregar o portal.<br><span>O sistema foi atualizado. Tente novamente em alguns segundos.</span>'}})();</script>
</body></html>
