<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Portal Administrativo</title>
</head>
<body style="margin:0;background:#3f165f;color:#fff;font-family:Arial,sans-serif">
  <div id="status" style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">Carregando o Portal Administrativo…</div>
  <script>
  (async function(){
    const status=document.getElementById('status');
    try{
      const response=await fetch('../index.html',{cache:'no-store'});
      if(!response.ok) throw new Error('Falha ao carregar o portal administrativo ('+response.status+').');
      let html=await response.text();
      // Corrige qualquer recurso absoluto caso novos arquivos sejam adicionados ao portal.
      html=html.replace(/(\s(?:src|href)=['"])\/(?!\/)/gi,'$1../');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      status.innerHTML='<div><h1 style="margin:0 0 12px">Não foi possível abrir o Portal</h1><p style="opacity:.85">'+String(error.message||error)+'</p><p><a href="../" style="color:#ffad52">Voltar ao início</a></p></div>';
    }
  })();
  </script>
</body>
</html>
