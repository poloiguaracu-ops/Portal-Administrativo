<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Instituto Educacional Canoa Grande</title>
</head>
<body style="margin:0;background:#190629;color:#fff;font-family:Arial,sans-serif">
  <div id="status" style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">Carregando o site do Instituto…</div>
  <script>
  (async function(){
    const status=document.getElementById('status');
    try{
      const response=await fetch('../landing.html',{cache:'no-store'});
      if(!response.ok) throw new Error('Falha ao carregar o site institucional ('+response.status+').');
      let html=await response.text();
      // GitHub Pages publica este projeto em /Portal-Administrativo/.
      // Convertemos recursos absolutos para caminhos relativos ao projeto.
      html=html.replace(/(\s(?:src|href)=['"])\/(?!\/)/gi,'$1../');
      // Mantém a identidade visual usando a imagem original do logo.
      html=html.replace(/\.\.\/instituto-logo\.svg/gi,'../instituto-logo-original.jpg');
      // O card "44 formações" estava incorreto: são 11 técnicos + 33 livres + Magistério = 45.
      html=html.replace(/44 formações/g,'45 formações');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      status.innerHTML='<div><h1 style="margin:0 0 12px">Não foi possível abrir o Instituto</h1><p style="opacity:.85">'+String(error.message||error)+'</p><p><a href="../" style="color:#ffad52">Voltar ao início</a></p></div>';
    }
  })();
  </script>
</body>
</html>
